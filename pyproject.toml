[project]
name = "ecom-product-multimodal-qa"
version = "0.1.0"
description = "电商商品多模态问答：模态缺口量化 + 三通道融合对比（文本/caption/真看图）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "pydantic",
    "openai",
    "langgraph",
    "rank-bm25>=0.2.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "self_correcting_rag"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
